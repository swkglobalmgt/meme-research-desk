name: daily-report

on:
  schedule:
    - cron: "17 13 * * *"     # once a day, ~7-8am Central
  workflow_dispatch: {}

concurrency:
  group: research-cycle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m desk.run report
      - name: Commit the report so it shows on the repo page
        run: |
          git config user.name "research-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/REPORT.md reports/dashboard.html reports/summary.json
          git diff --cached --quiet || git commit -m "Daily paper-trading report $(date -u +%F)"
          git push

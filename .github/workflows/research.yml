name: research-cycle

on:
  schedule:
    - cron: "4,19,34,49 * * * *"   # asked every 15 min; GitHub often delays/skips, so ~every 30 min in practice
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["desk/**", "tests/**", ".github/workflows/research.yml", "requirements.txt"]

concurrency:
  group: research-cycle
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
      DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests (safety filters + P&L math)
        if: github.event_name != 'schedule'
        run: python -m pytest -q
      - name: Paper research cycle
        run: python -m desk.run all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard
          path: reports/
          retention-days: 7
